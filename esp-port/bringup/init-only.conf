# Bring-up experiment: re-send the panel init sequence and write no pixels.
#
# Stage 1 of the AXS15231B bring-up. Flash the vendor demo first
# (./flash.sh jc3248), confirm its UI is on the glass, then flash this build.
# The boot path sends the panel nothing, so the vendor image survives; after
# 20 s the bring-up thread starts re-sending the init sequence every 15 s.
#
#   does the picture fade / darken / rotate / invert?
#       our commands do reach the panel, and something in the init path is
#       putting it into a dark state -> bisect with CONFIG_AXS15231B_INIT_LIMIT
#   does the picture survive untouched?
#       no command of ours has ever been understood -> the fault is transport
#
# Build (from the repo root):
#   sh esp-port/build_cobantab1a.sh -C esp-port/bringup/init-only.conf
# or, when overriding the shield conf directly, the two instrument switches
# below must stay off: INIT_ONLY owns the panel and cannot run beside them.

CONFIG_AXS15231B_FILL_TEST=n
CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_COLOR_TEST=n
CONFIG_AXS15231B_INIT_ONLY=y
