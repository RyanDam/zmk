# Coban Tab 1a dev harness (backlog h01) — with tab1a-devkit.overlay
#
#   sh zmk/esp-port/build_cobantab1a.sh -O zmk/esp-port/bringup/tab1a-devkit.overlay -C zmk/esp-port/bringup/tab1a-devkit.conf
#
# Enables the harness probes (app/src/tab1a/): WS2812 chase, key-event log,
# I2S tone, VBAT ADC read. Not a product configuration — never ship this.

CONFIG_ZMK_TAB1A_HARNESS=y

# Devices the harness overlay enables
CONFIG_LED_STRIP=y
CONFIG_I2S=y
CONFIG_ADC=y
