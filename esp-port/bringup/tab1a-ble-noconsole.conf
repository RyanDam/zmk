# Self-typing BLE repro with no console at all: SHELL/LOG/console off;
# CONFIG_ZMK_VKEY_BENCH (app/src/vkey_bench.c) self-fires pos 9 press/release
# every 500 ms, starting ~12 s after boot.
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-ble-noconsole.conf
# Flash, replug, open TextEdit on the Mac: it reconnects (pairing intact) and
# typing starts by itself.
# Add-on for the SMP-off variant: build with
#   EXTRA_CONF_FILE=tab1a-ble-noconsole.conf + tab1a-ble-smpoff.conf

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ESP_SPIRAM=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_VKEY_SHELL=n
CONFIG_ZMK_VKEY_BENCH=y
