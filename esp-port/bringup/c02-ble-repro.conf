# c02 repro/qualification build (backlog c02) — BLE + storage path ON.
#
#   west blobs fetch hal_espressif          # BLE needs libble_app.a (findings §11)
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/c02-ble-repro.conf
#   ./flash.sh tab1a                          # then capture per tab1a-bench-runbook.md
#
# Purpose: reproduce the two §7 failures (storage error 261, HCI timeout
# assert) on the current v4.5.0+coban-fixes tree with the display active.
# CONFIG_ZMK_TAB1A_DEBUG forces CONFIG_SETTINGS on, so the storage failure
# can ALSO be reproduced in a separate BLE-off run by dropping the
# CONFIG_ZMK_BLE=y line (no blobs needed for that variant).

CONFIG_ZMK_BLE=y

CONFIG_ZMK_TAB1A_DEBUG=y
CONFIG_FLASH_MAP_LABELS=y

# Log the BT/HCI path verbosely enough to name the timing-out command
CONFIG_BT_LOG_LEVEL_DBG=y
CONFIG_LOG_PRINTK=y
