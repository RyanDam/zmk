# tab1a-devkit.conf + verbose I2S/DMA logging — diagnostics only, not the
# harness bring-up conf itself.
# Purpose (h01 bench 2026-11-21): the harness tone died at
# i2s_trigger(START) -> -EIO; i2s_esp32 wraps the real errno in LOG_DBG,
# so raise that module's level to see what start_transfer failed on.
#
#   sh zmk/esp-port/build_cobantab1a.sh -O zmk/esp-port/bringup/tab1a-devkit.overlay -C zmk/esp-port/bringup/tab1a-devkit-i2sdbg.conf

CONFIG_ZMK_TAB1A_HARNESS=y

CONFIG_LED_STRIP=y
CONFIG_I2S=y
CONFIG_ADC=y

# the actual point:
CONFIG_I2S_LOG_LEVEL_DBG=y
CONFIG_DMA_LOG_LEVEL_DBG=y
