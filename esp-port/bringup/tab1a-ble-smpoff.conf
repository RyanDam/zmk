# Open-link BLE repro: tab1a-ble-noconsole.conf + SMP off — phones cannot pair
# by design (device name "Tab OpenLink"); the node harness connects instead.
# Pairs with a19-smpoff-experiment.patch — a source hack: NEVER commit it,
# keep zephyr/ clean.
# Build with: EXTRA_CONF_FILE=tab1a-ble-noconsole.conf + tab1a-ble-smpoff.conf

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ESP_SPIRAM=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_VKEY_SHELL=n
CONFIG_ZMK_VKEY_BENCH=y

CONFIG_BT_SMP=n
CONFIG_BT_DEVICE_NAME="Tab OpenLink"
