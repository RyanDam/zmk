# a13 BLE crash bisection, variant A16 (2026-11-24): NO-CONSOLE hammer.
#
# All prior deaths mixed two suspects on one chip: BLE notification TX
# (via the HCI blob) and the USB-Serial-JTAG console that the shell
# logged every tap through. This build deletes the second suspect:
# SHELL=n, LOG=n, console off; CONFIG_ZMK_VKEY_BENCH (app/src/
# vkey_bench.c) self-fires pos 9 press/release every 500 ms from the
# system workqueue, forever, starting 12 s after boot.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-ble-noconsole.conf
#   flash; replug; open TextEdit (or Finder); wait 12s+ for the Mac to
#   reconnect (pairing intact) — keystrokes start automatically.
#   Watch >= 3 minutes: keys keep coming + Bluetooth shows Connected?
#
# GREEN (keys flow >3 min, was death at tap 5-10 = 5-10 s) => the wedge
#   needs console traffic in the loop: product fix = production builds
#   without USJ console (already the plan!) + report the USJ/BT co-sleep
#   style wedge upstream (cf. esp-idf#18996: same chip rev, same host).
# DEAD (keys stop within seconds) => pure BLE TX wedge; escalate to
#   controller-blob-level debugging (ble_50 mode pinning, blob versions).

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ESP_SPIRAM=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_VKEY_SHELL=n
CONFIG_ZMK_VKEY_BENCH=y

# A19 = A16 + SMP off (open link, no encryption)
CONFIG_BT_SMP=n
CONFIG_BT_DEVICE_NAME="Tab OpenLink"
