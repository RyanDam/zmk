# Bring-up experiment: commands that cannot be invisible, over the real MSPI path.
#
# Why this exists: init-only against the vendor picture proved nothing, because
# re-sending the same init that created that picture is legitimately invisible.
# The command probe sends two commands whose effect on any visible picture
# cannot be subtle - MADCTL scan axes (the image rotates) and display inversion
# (colours flip) - through the driver's own MSPI framing, with no bit-banging
# and no pixels involved. If either moves the glass, the MSPI transport is
# heard and everything narrows to the pixel path; if several rounds produce no
# flicker at all, the transport itself is the fault and the SPI-path build
# (spi-path.conf) is the next flash.
#
# Boot must send nothing, so the vendor image survives the reflash:
#
#   ./flash.sh jc3248            # vendor demo; confirm its UI is on the glass
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/invert-probe.conf
#   ./flash.sh tab1a             # do NOT power-cycle
#
# Every 1.5 s the probe alternates MADCTL and inversion; the whole cycle
# repeats every few seconds forever.

CONFIG_AXS15231B=y
CONFIG_AXS15231B_SKIP_INIT=y
CONFIG_AXS15231B_COMMAND_PROBE=y

CONFIG_AXS15231B_FILL_TEST=n
CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_GPIO_QSPI_PROBE=n
CONFIG_AXS15231B_QSPI_READBACK=n
CONFIG_AXS15231B_COLOR_TEST=n
