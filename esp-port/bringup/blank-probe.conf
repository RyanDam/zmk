# Bring-up experiment: one unambiguous command every 4 seconds.
#
# The command probe faded the vendor picture to black WITHOUT ever flipping
# colours - a result that fits neither "deaf panel" (init-only rounds contain
# SLPOUT and changed nothing on the same picture) nor "heard panel" (21h
# inverts instantly when decoded). What fits is a panel being put to SLEEP by
# a stream that arrives corrupted, since every later recovery sequence
# contains 11h and wakes it again. This build tests exactly that, one command
# at a time, logging what the glass must do after each:
#
#   11h  a faded/sleeping panel must be back NOW
#   29h  an off panel must be back NOW
#   10h  a panel that HEARD this fades to black over ~2 s, backlight on
#   11h  the fade must reverse now
#   21h / 20h  colours flip to negatives and back, instantly
#
# Verdicts, for one pass of watching:
#   glass obeys several steps            -> the bus decodes; the fault is in
#                                           payloads/parameters, not presence
#   glass obeys none, fades anyway       -> corrupted stream on the wire; the
#                                           transport (realign / SPI path) is next
#   glass does nothing at all, stays put -> genuinely deaf on this transport
#
# Run against the still-visible vendor picture - flash the vendor demo,
# confirm the UI, then this, with NO power cycle:
#
#   ./flash.sh jc3248
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/blank-probe.conf
#   ./flash.sh tab1a

CONFIG_AXS15231B=y
CONFIG_AXS15231B_SKIP_INIT=y
CONFIG_AXS15231B_BLANK_PROBE=y

CONFIG_AXS15231B_FILL_TEST=n
CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_GPIO_QSPI_PROBE=n
CONFIG_AXS15231B_QSPI_READBACK=n
CONFIG_AXS15231B_COLOR_TEST=n
