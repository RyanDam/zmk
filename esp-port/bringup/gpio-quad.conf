# Bring-up experiment: the calibrated frame, hand-driven, no controller.
#
# Sequence of facts so far (findings doc §15/§16):
#   - the vendor build inverts/blanks/fades the panel on command using a
#     32-bit header driven FOUR lines at a time (SPI_TRANS_MODE_QIO);
#   - ZMK's MSPI controller, sending what should be the identical framing,
#     changes nothing on the glass;
#   - so either the panel never sees what the controller says it transmits,
#     or our model of the frame is wrong somewhere.
#
# This fragment answers it without the controller: every edge is bit-banged
# (CS, eight nibble clocks, release), commands are INVON/INVOFF/SLPIN/SLPOUT,
# and both nibble lane orders rotate every 4 s. Expectations:
#
#   one lane order flips the colours  -> lane order found; MSPI controller
#                                        output is what lies
#   neither order does anything       -> the frame model itself is wrong;
#                                        capture the vendor waveform
#   sleep pair reacts but inversion does not -> partial decode; count clocks
#
# Run over the still-visible vendor picture (no power cycle):
#   ./flash.sh jc3248   (confirm the UI), then
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/gpio-quad.conf
#   ./flash.sh tab1a

CONFIG_AXS15231B=y
CONFIG_AXS15231B_SKIP_INIT=y
CONFIG_AXS15231B_GPIO_QSPI_PROBE=y
CONFIG_AXS15231B_GPIO_QUAD_PROBE=y

CONFIG_AXS15231B_QSPI_READBACK=n
CONFIG_AXS15231B_FILL_TEST=n
CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_BLANK_PROBE=n
CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_COLOR_TEST=n
