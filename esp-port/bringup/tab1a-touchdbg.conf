# Coban Tab 1a — on-glass touch readout, diagnostics only.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-touchdbg.conf
#
# Puts the live touch readout back on the glass (app/src/display/screen_mgr.c):
# a translucent "touch dbg" chip on every page (raw x,y, press state, the swipe
# verdict with the deciding math, and the controller's watchdog counters) plus a
# full "dbg" page with a red dot under the finger.
#
# The overlay family is one switch now: CONFIG_ZMK_DISPLAY_DEBUG_OVERLAY is the
# parent, _TOUCH / _LAYOUT are its children (app/src/display/Kconfig). The
# parent must be =y for a child to mean anything — setting a child alone gets
# dropped by Kconfig. Product builds leave the parent off. Kept as a fragment so
# the harness stays reachable while backlog d05 (the same thing with a runtime
# toggle) is still open.

CONFIG_ZMK_DISPLAY_DEBUG_OVERLAY=y
CONFIG_ZMK_DISPLAY_DEBUG_OVERLAY_TOUCH=y
# Borders on every container would fight the readout for the screen; this
# fragment is the touch arm only.
# CONFIG_ZMK_DISPLAY_DEBUG_OVERLAY_LAYOUT is not set
