# Coban Tab 1a — on-glass touch readout, diagnostics only.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-touchdbg.conf
#
# Puts the live touch readout back on the glass (app/src/display/screen_mgr.c):
# a translucent "touch dbg" chip on every page (raw x,y, press state, the swipe
# verdict with the deciding math, and the controller's watchdog counters) plus a
# full "dbg" page with a red dot under the finger. Product builds leave
# CONFIG_ZMK_DISPLAY_TOUCH_DEBUG off — the readout covers the UI and adds a page
# to the swipe order. Kept as a fragment so the harness stays reachable while
# backlog d05 (the real debug overlay, with a runtime toggle) is still open.

CONFIG_ZMK_DISPLAY_TOUCH_DEBUG=y
