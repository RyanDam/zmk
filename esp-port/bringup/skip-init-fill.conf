# Bring-up experiment: send the panel no commands, and paint the fills onto
# whatever picture is already on the glass.
#
# Stage 2 of the AXS15231B bring-up, run after (or instead of) init-only.conf.
# Flash the vendor demo first (./flash.sh jc3248) and confirm its UI is on the
# glass; the boot path here sends the panel nothing at all, so that UI stays in
# the panel's GRAM and on screen. The fills then paint over it.
#
#   the vendor picture is replaced by our pattern
#       pixels reach the panel - the transport is fine and only the command
#       sequence (init) is what darkens it
#   the vendor picture is untouched
#       nothing of ours reaches the panel, pixels included - the fault is the
#       transport, not the init table
#
# The bars pattern counts the bring-up cycle (1 white bar on cycle 1, 2 on
# cycle 2, ... 8 on cycle 8), and the two passes are logged, so which write
# landed can be read off the glass.
#
# Build (from the repo root):
#   sh esp-port/build_cobantab1a.sh -C esp-port/bringup/skip-init-fill.conf

CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_SKIP_INIT=y
CONFIG_AXS15231B_FILL_TEST=y
CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_COLOR_TEST=n
