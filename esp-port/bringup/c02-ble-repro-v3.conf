# c02 BLE repro v3 (follow-up to the v1 run on 2026-11-21, bench log
# /tmp/c02-stepA.log): v1 crashed 0.02 s after `do_db_hash` with a load
# prohibited inside xtensa_restore_high_regs switching INTO bt_long_wq
# (k_thread @0x3fcb1940) — i.e. the BT long-work-queue context was already
# clobbered. Its stack is only CONFIG_BT_LONG_WQ_STACK_SIZE=1400 while v1
# ran with CONFIG_BT_LOG_LEVEL_DBG=y (+ BT_DEBUG macros) on the very path
# that runs on that queue (settings load / gatt_delayed_store / db_hash).
# Hypothesis: observation-effect stack overflow, NOT the §7 HCI assert.
#
# v2 keeps BLE + the c02 debug module, drops the DBG log flood, and gives
# bt_long_wq headroom. If this boots clean, §7's "Controller unresponsive"
# assert does NOT reproduce on the current tree and the storage round-trip
# result (step A: healthy) stands.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/c02-ble-repro-v2.conf
#   ./flash.sh tab1a

CONFIG_ZMK_BLE=y

CONFIG_ZMK_TAB1A_DEBUG=y
CONFIG_FLASH_MAP_LABELS=y

# bt_long_wq stack experiment (see header): 1400 -> 2048.
CONFIG_BT_LONG_WQ_STACK_SIZE=2048

# Keep BT logs at INFO only — do NOT set CONFIG_BT_LOG_LEVEL_DBG here:
# that is the v1 observer-effect variable under test.

# v3 addition (same file, run 3): the v2 run showed every LVGL flush
# failing via mspi `Packet 0 failed: -12` (ENOMEM) — the framebuffer/VDB
# live in PSRAM and with CONFIG_MSPI_ESP32_PSRAM_DMA=n the driver bounced
# the (full-screen, 307 KB) flush through the 16 KB internal heap, which
# can never succeed. PSRAM DMA hands the aligned PSRAM buffer straight to
# GDMA. Watch for the documented trade-off: PSRAM bandwidth contention
# (BLE coex) can underrun the TX FIFO -> visible banding; log has no
# underrun errors if so.
CONFIG_MSPI_ESP32_PSRAM_DMA=y
