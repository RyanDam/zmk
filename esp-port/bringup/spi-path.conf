# Bring-up experiment: the same instrument, on the SPI controller instead of MSPI.
#
# Needs the overlay too - the shield's own overlay re-types &spi2 as an MSPI
# controller, and the panel's bus comes from devicetree, so a Kconfig change
# alone cannot move it:
#
#   sh esp-port/build_cobantab1a.sh \
#        -C esp-port/bringup/spi-path.conf -O esp-port/bringup/spi-path.overlay
#
# Why this build exists: the SPI path is the one path in this project's history
# with a witnessed panel response (DISPLAY_OFF visibly blanked the panel -
# findings doc row 21), and the ported MSPI controller has never produced a
# visible change in any framing (row 26). Running the identical fills and the
# identical visible commands here splits "our MSPI port does not produce a usable
# waveform" from "the panel or its wiring is dead", in one flash.
#
# CONFIG_SPI is not enabled by the shield conf at all, so this fragment sets up
# the whole SPI side; without SPI_EXTENDED_MODES the driver refuses to build,
# because the pixel phase needs SPI_LINES_QUAD.
#
# The three register probes are on because they are free, because they are the
# only SPI-specific instrumentation this driver has, and because two of them
# (WIRE_PROBE, CS_PROBE) read back state the MSPI build cannot reach: whether the
# quad line-mode bits reach the controller, and whether the CS pad is really
# being driven.

CONFIG_MSPI=n
CONFIG_SPI=y
CONFIG_SPI_EXTENDED_MODES=y

CONFIG_AXS15231B=y
CONFIG_AXS15231B_FILL_TEST=y
CONFIG_AXS15231B_COMMAND_PROBE=y
CONFIG_AXS15231B_WIRE_PROBE=y
CONFIG_AXS15231B_PAD_PROBE=y
CONFIG_AXS15231B_CS_PROBE=y

CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_SKIP_INIT=n
CONFIG_AXS15231B_GPIO_QSPI_PROBE=n
CONFIG_AXS15231B_COLOR_TEST=n
