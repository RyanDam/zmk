# a13 BLE crash bisection, variant A13 (2026-11-24): the RL-emulation
# test, CLEAN base (buffered logging!).
#
# Theory (evidence: A5/A6 last coherent BT-DBG words are always HCI
# opcode 0x2027 = LE Add Device to Resolving List, sent by the host on
# every BONDED reconnect — which is exactly our repro; after it, the
# ESP32-S3 BLE blob dies a total SoC deadlock: JTAG peripheral goes
# deaf too, only power-cycling USB revives it, PSRAM/display/BT-debug
# all irrelevant, no-link builds immortal):
#   zephyr/drivers/bluetooth/hci/hci_esp32.c now emulates the whole
#   resolving-list command family in the driver (ADD/REM/CLEAR ->
#   cmd_complete OK, READ_RL_SIZE -> 0, READ_*_RPA -> fail) like it
#   already emulates the VS commands. Host keeps moving; blob never
#   sees a command it apparently can't survive.
# Second patch also in the driver (VHCI send wait instead of force) —
# if this build goes GREEN, bisect which patch mattered.
#
# DO NOT enable CONFIG_LOG_MODE_IMMEDIATE on this board: immediate
# mode + USB-Serial-JTAG CDC console + BT = console TX deadlock within
# seconds of a link (A12 "eyes" lesson, also A3T earlier).
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-ble-rlfix.conf
#   (flash; Mac auto-reconnects; /tmp/tab1a-jtag-repro.sh)

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ESP_SPIRAM=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y
