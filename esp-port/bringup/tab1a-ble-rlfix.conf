# Self-typing BLE repro with console + link logging, to capture the last words
# before the wedge. Pairs with
# patches/hci_esp32-rl-emul-and-recv-wait.patch (the HCI driver emulates the
# resolving-list command family and waits on VHCI send instead of forcing).
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-ble-rlfix.conf
# DO NOT enable CONFIG_LOG_MODE_IMMEDIATE on this board: immediate mode +
# USB-Serial-JTAG CDC console + BT = console TX deadlock within seconds of a link.

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_STUDIO=n
CONFIG_ESP_SPIRAM=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y
