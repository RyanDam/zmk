# ARCHIVED 2026-11-27 - closed the Studio-RPC connect freeze (a14/b06): the
# `usbd` thread needed 1408 B against its 1024 default and the overrun faulted
# an unrelated thread ~1 s later. Fixed with CONFIG_USBD_THREAD_STACK_SIZE=2048
# in zmk-config's cobantab1a.conf. The smuggler module this fragment enabled
# (app/src/tab1a/tab1a_crash_report.c) was removed with the investigation; kept
# as the knob recipe to rebuild it. Two traps it found: plain __noinit does NOT
# survive this board's reset (use .rtc_noinit), and the reboot lives inside
# k_sys_fatal_error_handler, so overriding it must call sys_reboot() itself.
# The EXCEPTION_DUMP_HOOK line is what links arch_exception_set_dump_hook in.
#
# Bench-only fragment: smuggle the fault dump out of a board whose console is
# unreadable and whose RPC port cannot be written to without faulting.
#
#   BUILD_DIR_OVERRIDE=build/cobantab1a-smuggle \
#     sh esp-port/build_cobantab1a.sh -C esp-port/bringup/tab1a-crash-smuggle.conf
#
# Then flash, trigger the fault once (any write), and read the RPC port raw with
# the harness (esp-port/bringup/README.md): the dump comes back unprompted as
# "#CRASH1 ..." chunks after the reboot. Nothing here is in a product build.

CONFIG_ZMK_TAB1A_CRASH_REPORT=y

# The dump is only worth capturing if the fault ends in a visible reset, so the
# retained record is written before the chip re-boots.
CONFIG_RESET_ON_FATAL_ERROR=y

# The register/EXCCAUSE lines arrive through the arch exception dump hook (that
# hook is only linked in when EXCEPTION_DUMP_HOOK is on), and the call chain
# through printk's backtrace printer.
CONFIG_EXCEPTION_DUMP=y
CONFIG_EXCEPTION_DUMP_HOOK=y
CONFIG_XTENSA_ENABLE_BACKTRACE=y

# So the record says which thread died rather than just an address.
CONFIG_THREAD_NAME=y

# Stack high-water per thread, streamed as "#STK name,unused,size" — this is
# what turned "an unrelated thread faults" into "the usbd thread needs 1408 of
# its 1024 bytes". The reading is a high-water mark, so sampling after a load
# burst is valid.
CONFIG_INIT_STACKS=y

# One-shot illegal instruction on the first boot after flashing: verifies the
# capture-and-report chain against a known fault before trusting it with the
# real one. Drop it (=-n) to only report real faults.
CONFIG_ZMK_TAB1A_CRASH_REPORT_SELF_FAULT=y
