# ARCHIVED 2026-11-27 - dead end on this board: the stack sentinel and the
# periodic thread analyzer each make the tab fault ~1 s into boot, so a build
# with them on is not a usable repro vehicle (Zephyr 4.5 has no
# STACK_OVERFLOW_CHECK). Read a silent death the way tab1a-crash-smuggle.conf
# does instead, or with CONFIG_RESET_ON_FATAL_ERROR=y alone.
#
# Bench-only: make a silent tab1a death name itself on the UART0 console.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C esp-port/bringup/tab1a-crash-forensics.conf
#   ./flash.sh tab1a
#   ./esp-console.py watch 60          # workspace root; logs to /tmp/tab1a-console.log
#
# That console route needs the P1 wire to work. When it does not (this bench),
# add tab1a-console-over-usb.{conf,overlay} and read the same output from the RPC
# port instead — see esp-port/bringup/README.md.
#
# Why: the product build halts on a panic (RESET_ON_FATAL_ERROR=n) and dumps
# registers (EXCEPTION_DUMP=y), so a *crash* is already visible from the console.
# What it cannot show is the other shape of "device dies, screen freezes, console
# goes quiet" — a stack overrun, which on Zephyr 4.5 has no checker
# (STACK_OVERFLOW_CHECK no longer exists) and therefore corrupts memory quietly.
# The tab runs several small stacks with real work on them: udc_dwc2 1024,
# usbd 1024, sysworkq 3072 (which carries the Studio RPC notification sends),
# and the RPC thread at 8192 with a measured 2688-byte frame in rpc_main.
#
# Neither knob is in the product build, and both perturb timing: use this to
# identify a victim, then re-test without it before believing the fix.

# Magic word at every stack base, verified on each context switch and IRQ. An
# overrun becomes "Invalid magic value 0x..(expected 0x..) : stack pointer
# overflow (stack size N)" naming the thread, instead of silent corruption.
CONFIG_STACK_SENTINEL=y

# Per-thread stack high-water marks, on the console, every 15 s: the numbers that
# say a 1024-byte USB thread is running at the edge rather than with room.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
# The analyzer's own thread: its print loop runs through the immediate console.
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
