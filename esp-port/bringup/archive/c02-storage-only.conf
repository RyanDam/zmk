# ARCHIVED 2026-11-26 with c02 (closed 2026-11-21): the flash_esp32 error-261
# settings failure it reproduced is fixed. It selects CONFIG_ZMK_TAB1A_DEBUG,
# which is the harness symbol the 2026-11-26 cleanup pass consolidated.
# c02 storage-only repro (BLE OFF) — no blobs required.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/c02-storage-only.conf
#
# Reproduces the `flash_esp32` error-261 / settings failure independently of
# Bluetooth: CONFIG_ZMK_TAB1A_DEBUG selects CONFIG_SETTINGS, which the BLE
# stack normally implies and which the bring-up config silently drops
# (zmk/esp-port/bringup/README.md, tab1a_debug.c header). See
# tab1a-bench-runbook.md "Step A".

CONFIG_ZMK_TAB1A_DEBUG=y
CONFIG_FLASH_MAP_LABELS=y
