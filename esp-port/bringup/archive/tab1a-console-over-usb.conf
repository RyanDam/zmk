# ARCHIVED 2026-11-27 - negative result, kept so nobody retries it: console and
# logging over the same device that is the console starves enumeration, so
# macOS binds no interface at all (no /dev/cu node). The tab's console stays on
# UART0/P1. See tab1a-console-over-usb.overlay for the measured detail.
#
# Bench-only fragment: read the console off the RPC's own USB CDC port.
#
# The Tab's console pins (P1: GPIO43 TX / GPIO44 RX) do not deliver bytes on
# this bench (see the workspace root esp-console.py for the whole investigation:
# dongle loopback exact, board-side pin short silent), so a UART0 console is
# useless here. The RPC serial port is always there, so move zephyr,console onto
# it and read the crash from the port we already have open.
#
# Pair it with the overlay of the same name and with tab1a-crash-forensics.conf,
# which supplies the sentinel and the thread analyzer; this fragment only handles
# the console and what has to change around it:
#
#   BUILD_DIR_OVERRIDE=build/cobantab1a-live sh esp-port/build_cobantab1a.sh \
#     -O esp-port/bringup/tab1a-console-over-usb.overlay \
#     -M '-DEXTRA_CONF_FILE=<abs>/tab1a-crash-forensics.conf;<abs>/tab1a-console-over-usb.conf'
#
# Both the deferred log thread and the shell backend are gone from the picture on
# purpose: with LOG_MODE_IMMEDIATE the last words are emitted by the thread that
# dies, and the console claims RX only through the shell backend, so CONFIG_SHELL=n
# is what leaves uart_rpc_transport.c's RX callback untouched. Bench-only: a
# shipped image must not put the console on the port Studio talks on.

CONFIG_SHELL=n

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Print and halt rather than reboot into a port the harness no longer has open.
CONFIG_RESET_ON_FATAL_ERROR=n

# The analyzer needs poisoned stacks to report free space, and thread names to
# be worth reading at all.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
