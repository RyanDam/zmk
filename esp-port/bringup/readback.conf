# Bring-up experiment: hand-clock the QSPI frames from GPIO, and make the panel
# report its own registers back over the same four wires.
#
# Stage 3c of the AXS15231B bring-up, and the only experiment here that needs
# nobody watching the glass. It replaces the previous GPIO probe run, whose
# result is void: that one sent SWRESET and then only COLMOD/CASET/DISPON, so it
# left the panel's boost, gate, source and gamma registers at their reset
# defaults and would have shown garbage on any bus, ours or the vendor's.
#
# What this run does, in order:
#   1. drives all six pads and reads them back from the pad itself, then watches
#      SCLK at the pad while the hand-built clock runs (the wire is measured, not
#      assumed);
#   2. reads 04h/0Ah/0Bh/0Ch/DAh with opcode 03h and 0Bh, with and without a
#      dummy phase, BEFORE writing anything - the panel's registers survived the
#      reflash, so this reads the state the previous firmware left;
#   3. SWRESET, SLPOUT, MADCTL, COLMOD, CASET, the full 32-entry vendor table,
#      DISPON - with the read-backs repeated after each step, and 0Bh/0Ch read
#      before and after their own writes so a change is visible in one log line;
#   4. the three mapping-invariant fills, so the register answer and the glass
#      answer come from the same run.
#
# Reading the log:
#   "reg 0Bh CHANGED 00h -> 80h"   the panel decoded our write - the wire, the
#                                  framing and the clock mode are all proven
#   "ANSWERED" but never CHANGED   reads work, writes do not arrive decoded
#   "no answer" everywhere         the read path itself is unproven; the glass is
#                                  the only sensor left, as before
#
# Build (from the repo root):
#   sh esp-port/build_cobantab1a.sh -C esp-port/bringup/readback.conf
# Console:
#   ./flash.sh tab1a --monitor   (or: west monitor -d build/cobantab1a)

CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_SKIP_INIT=y
CONFIG_AXS15231B_FILL_TEST=n
CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_COLOR_TEST=n
CONFIG_AXS15231B_GPIO_QSPI_PROBE=y
CONFIG_AXS15231B_QSPI_READBACK=y
