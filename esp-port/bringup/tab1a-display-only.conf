# a13 BLE crash bisection, variant B (2026-11-23): display ON, BLE OFF.
# Companion to tab1a-ble-only.conf. If pressing on-glass keys is stable
# here, the crash needs the BLE link — not the new vkey firing path alone.
#
#   sh zmk/esp-port/build_cobantab1a.sh -C zmk/esp-port/bringup/tab1a-display-only.conf
#   (then flash; keys fire locally, no wireless)
#
# Note: with BLE off the keymap HID reports just go nowhere — tile flash
# and local behavior (e.g. layer pips) still exercise the full press path.

CONFIG_ZMK_BLE=n
