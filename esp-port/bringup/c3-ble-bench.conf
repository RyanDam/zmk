# ESP32-C3 CONTROL build: same self-typing repro as tab1a-ble-noconsole.conf
# on a different chip and controller blob (C3 BLE-only vs the S3's BTDM
# dual-mode blob). Survives where the S3 dies => the S3 blob is implicated.
#   sh esp-port/build_zmk_c3.sh -C esp-port/bringup/c3-ble-bench.conf
# Pair "ZMK_C3..." (fixture keymap name); typing starts ~12 s after power-on.
CONFIG_ZMK_VKEY_BENCH=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_VKEY_SHELL=n
