# C3 CONTROL for the S3 a13 wedge (d03): identical firmware-level repro to
# tab1a-ble-noconsole (no shell/log/console; CONFIG_ZMK_VKEY_BENCH
# self-fires HID notifications at ~2 Hz once a link is up) on the
# esp32c3_supermini — a different chip AND a different controller blob
# (the C3's is the BLE-only SOC, the S3 runs the BTDM dual-mode blob).
#   sh esp-port/build_zmk_c3.sh -C esp-port/bringup/c3-ble-bench.conf
# Pair "ZMK_C3..." (fixture keymap name — whatever shows up) to the Mac;
# typing starts ~12 s after power-on by itself.
# C3 survives >> 3 min while S3 dies in ~5 s => S3 BTDM blob implicated
# (upstream report artifact). C3 dies too => Zephyr hci driver / host
# HCI sequencing, not the S3 blob alone.
CONFIG_ZMK_VKEY_BENCH=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_VKEY_SHELL=n
