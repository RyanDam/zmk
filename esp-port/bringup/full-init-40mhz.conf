# Bring-up experiment: can ZMK drive this panel AT ALL - clean slate.
#
# Every previous full-init attempt ran at 1 MHz and/or with the (now PROVEN
# wrong) quad-header command framing. Both are corrected in the tree:
# commands go out as 1-wire 32-bit headers exactly like the vendor's tx_param,
# and boost-clock.overlay raises the link to the vendor's proven 40 MHz.
#
# This fragment runs the WHOLE init (SWRESET path + full vendor table) at
# probe time and then paints the three solid fills, so a healthy result is
# not subtle: the glass ends up a solid blue screen. Black means our emitter
# genuinely cannot drive this panel and the waveform itself must be compared.
#
# Panel state matters: there is no hardware reset line, so the panel must be
# power-on-reset before this runs - unplug USB, replug, THEN flash (flashing
# only resets the ESP32, not the panel).

CONFIG_AXS15231B=y
CONFIG_AXS15231B_SKIP_INIT=n

CONFIG_AXS15231B_FILL_TEST=y

CONFIG_AXS15231B_COMMAND_PROBE=n
CONFIG_AXS15231B_BLANK_PROBE=n
CONFIG_AXS15231B_INIT_ONLY=n
CONFIG_AXS15231B_GPIO_QSPI_PROBE=n
CONFIG_AXS15231B_GPIO_QUAD_PROBE=n
CONFIG_AXS15231B_QSPI_READBACK=n
CONFIG_AXS15231B_COLOR_TEST=n
