description: |
  AXS15231B QSPI LCD display controller, on an SPI bus.

  Each frame starts with a 32-bit header - a write opcode and an LCD command -
  on one data line, and a 0x32 header is followed by its pixel data on all four
  lines, under a single chip select assertion. The controller has to be in
  clock mode 3 (CPOL=1, CPHA=1) and has to be able to put four data lines on
  the wire (CONFIG_SPI_EXTENDED_MODES); the QSPI lines plus SCLK have to be
  routed to the panel, on the ESP32 through the GPIO matrix.

  This panel can also sit on an MSPI controller; see axs,axs15231b-mspi.yaml.
  Both files use the same compatible, which devicetree allows because they ask
  for different buses: a node is matched against the binding for the bus its
  parent is a controller of, so exactly one of the two applies.

compatible: "axs,axs15231b"

include: [spi-device.yaml, "axs,axs15231b-common.yaml"]
