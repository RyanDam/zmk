CONFIG_ZMK_USB=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# Advertise remote wakeup so the device can resume the USB bus (and flush
# pending RPC data) when the host suspends the port while idle.
CONFIG_ZMK_USB_REMOTE_WAKEUP=y
