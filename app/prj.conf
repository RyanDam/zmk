CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Zephyr 4.5 marks the legacy zero-copy ring buffer API deprecated and makes
# deprecation warnings fatal by default. ZMK still uses ring_buf_put_claim() and
# ring_buf_get_claim() in 27 places, so every build would fail. Keep the warnings
# visible but not fatal until those call sites move to ring_buf_put_ptr() and
# ring_buf_get_ptr().
CONFIG_DEPRECATED_KCONFIGS_AS_ERRORS=n
