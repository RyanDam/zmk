board:
  - nice_nano//zmk
  - nrfmicro/nrf52840/zmk
  - proton_c//zmk
shield:
  - corne_left
  - corne_right
  - romac
  - settings_reset
  - tidbit
include:
  - board: bdn9//zmk
  - board: nice60//zmk
  - board: xiao_ble//zmk
    shield: hummingbird
  - board: nrf52840_m2//zmk
    shield: m60
  - board: planck//zmk
  - board: proton_c//zmk
    shield: clueboard_california
  - board: nice_nano//zmk
    shield: kyria_left
    cmake-args: "-DCONFIG_ZMK_DISPLAY=y"
    nickname: "display"
  - board: nice_nano//zmk
    shield: kyria_left
    cmake-args: "-DCONFIG_ZMK_POINTING=y"
    nickname: "mouse"
  - board: sparkfun_pro_micro_rp2040//zmk
    shield: reviung41
    cmake-args: "-DSNIPPET='zmk-usb-logging'"
  - board: nice_nano//zmk
    shield: kyria_right
    cmake-args: "-DCONFIG_ZMK_DISPLAY=y"
    nickname: "display"
  - board: nice_nano//zmk
    shield: romac_plus
    cmake-args: "-DCONFIG_ZMK_RGB_UNDERGLOW=y"
    nickname: "underglow"
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view
    nickname: "niceview"
  # bdn9-studio quarantined (2026-09-30, Zephyr 4.4.1 gate): 16KB RAM cannot
  # hold the Studio RPC thread stack (4KB), CDC ACM buffers, USB device stack
  # and the branch's 28KB static dynamic-macro buffer (16x64 defaults, active
  # in every studio build). Even at 1x1 macro defaults it is ~8KB over.
  # Net effect: Studio needs >=256KB-class RAM on this fork.
  - board: nice_nano//zmk
    shield: reviung41
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "nrf52-studio"
  - board: nice_nano//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "split-left-studio"
  - board: nice_nano//zmk
    shield: corne_right
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "split-right-studio"
  - board: sparkfun_pro_micro_rp2040//zmk
    shield: reviung41
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "rp2040-studio"
  # samd21-studio quarantined (2026-09-30, Zephyr 4.4.1 gate): 32KB RAM cannot
  # hold the Studio RPC thread stack (4KB), CDC ACM buffers, USB device stack
  # and the branch's 28KB static dynamic-macro buffer at default sizes
  # (26KB over; fits at 92% only with 1x1 macro defaults).
  # Net effect: Studio needs >=256KB-class RAM on this fork.
