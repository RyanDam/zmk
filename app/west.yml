manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: cobanfirmware
      url-base: https://github.com/RyanDam
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: lvgl
      revision: 48e1ad1481fc39d2c27a96c6df151d75728417a9
      path: modules/lib/gui/lvgl
      remote: cobanfirmware
    - name: zmk-studio-messages
      revision: f5747098d70a056bfe27535a029b150530f95d2a
      path: modules/msgs/zmk-studio-messages
      remote: cobanfirmware
      repo-path: zmk-studio-messages
  group-filter: [+optional]
  self:
    west-commands: scripts/west-commands.yml
