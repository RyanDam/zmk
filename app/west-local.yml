manifest:
  remotes:
    - name: local
      url-base: file:///workspaces/zmk
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cobanfirmware
      url-base: https://github.com/RyanDam
  projects:
    - name: zephyr
      remote: local
      revision: v4.4.1+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: lvgl
      revision: zmk-v4.4.1
      path: modules/lib/gui/lvgl
      remote: local
      repo-path: modules/lib/gui/lvgl
    - name: zmk-studio-messages
      revision: 4e512abe042c4c4b6a1b4a5e7524058881ab11ad
      path: modules/msgs/zmk-studio-messages
      remote: cobanfirmware
      repo-path: zmk-studio-messages
  group-filter: [+optional]
  self:
    west-commands: scripts/west-commands.yml
