# SPDX-License-Identifier: MIT

description: |
  MPR121 touchpad behavior configuration.
  Maps touch events and swipe gestures to key behaviors.
  Bindings order: touch_start, touch_move, touch_end, tap, swipe_left, swipe_right, swipe_up, swipe_down

compatible: "zmk,behavior-mpr121-touchpad"

properties:
  bindings:
    type: phandle-array
    required: true
    description: |
      Behavior bindings in order:
      [0] = touch start
      [1] = touch move
      [2] = touch end
      [3] = tap
      [4] = swipe left
      [5] = swipe right
      [6] = swipe up
      [7] = swipe down
